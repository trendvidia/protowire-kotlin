name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The spec commit the cases in src/test/resources/text/ came from, and the
  # protowire-go release that must reproduce their goldens. The spec ref is a
  # SHA because no spec tag has testdata/text/ yet (v1.16.0 predates it).
  # Replace it with a tag once one does.
  PROTOWIRE_SPEC_REF: b021d24c1f8e5c2464aa15911b28dc8b59ffa083
  PROTOWIRE_GO_REF: v1.17.0

jobs:
  go-goldens:
    name: goldens match protowire-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: protowire-kotlin

      - uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire
          ref: ${{ env.PROTOWIRE_SPEC_REF }}
          path: protowire

      - uses: actions/checkout@v7
        with:
          repository: trendvidia/protowire-go
          ref: ${{ env.PROTOWIRE_GO_REF }}
          path: protowire-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: protowire-go/go.mod
          cache-dependency-path: protowire-go/go.sum

      - name: Run protowire-go over the vendored cases
        run: ./protowire-kotlin/scripts/check_go_goldens.sh protowire protowire-go

  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: ./gradlew build
        run: ./gradlew --no-daemon build
